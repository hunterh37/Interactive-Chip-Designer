<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipDesigner</title><link rel="stylesheet" href="/src/style.css">
<style>
  body { height:100vh; overflow:hidden; position:relative; }
  canvas.view, #field { position:fixed; inset:0; width:100%; height:100%; }
  #field { pointer-events:none; transition:opacity .6s; }
  .layer { position:fixed; z-index:2; transition:opacity .5s, transform .5s; }
  .hidden { opacity:0; pointer-events:none; transform:translateY(8px); }

  /* stage 0: join */
  #join { inset:0; display:flex; align-items:center; justify-content:center; gap:8vw; background:rgba(0,0,0,.55); }
  #qrwrap { background:#fff; padding:22px; }
  #qr { display:block; width:min(42vh, 380px) !important; height:auto !important; }
  #joininfo { display:flex; flex-direction:column; gap:14px; max-width:520px; }
  #count { font-size:clamp(72px, 13vh, 150px); font-weight:300; letter-spacing:-.05em; line-height:.9; font-variant-numeric:tabular-nums; }
  #names { display:flex; flex-wrap:wrap; gap:6px; min-height:30px; }
  #names span { border:1px solid var(--dim); padding:6px 10px; font-size:12px; letter-spacing:.12em; animation:in .4s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  #url { font-size:13px; color:var(--mute); letter-spacing:.06em; }

  /* top-left title */
  #title { left:36px; top:30px; display:flex; flex-direction:column; gap:8px; }
  #title b { font-family:var(--mono); color:var(--fg); font-size:clamp(24px, 3.2vw, 44px); font-weight:600; letter-spacing:.28em; line-height:1.1; }

  /* top-right mini join */
  #mini { right:28px; top:26px; display:flex; gap:12px; align-items:center; border:1px solid var(--dim); padding:10px; background:#000; }
  #mini canvas { width:72px !important; height:72px !important; background:#fff; padding:4px; }
  #mini div { display:flex; flex-direction:column; gap:4px; }

  /* overlays */
  #board { left:36px; bottom:120px; width:min(520px, 45vw); }
  #board .row { font-size:15px; padding:10px 0; } #board .row b { font-weight:400; font-variant-numeric:tabular-nums; }
  #board .row.new { animation:flash 1.2s ease-out; }
  @keyframes flash { 0% { background:#fff; color:#000; } 100% { background:transparent; } }
  #join.globe { background:linear-gradient(90deg, rgba(0,0,0,.85) 0, rgba(0,0,0,.6) 40%, transparent 62%); justify-content:flex-start; padding-left:6vw; gap:4vw; }
  #join.globe #qr { width:min(30vh, 280px) !important; }
  #sites { right:36px; top:96px; width:min(380px, 30vw); background:rgba(0,0,0,.78); padding:14px 16px; border:1px solid var(--line); }
  #sites .row { font-size:14px; padding:9px 0; } #sites .row b { font-weight:400; font-variant-numeric:tabular-nums; }
  #sites .row.lead b, #sites .row.lead span:first-child { color:#00e0a4; }
  #sites small { display:block; font-size:10px; color:var(--mute); letter-spacing:.08em; margin-top:2px; }
  #stats { right:36px; bottom:120px; width:260px; }

  /* presenter controls */
  #ctl { left:50%; bottom:28px; transform:translateX(-50%); display:flex; align-items:stretch; gap:0; border:1px solid var(--fg); background:#000; }
  #ctl button { border:none; padding:18px 26px; font-size:13px; letter-spacing:.2em; }
  #ctl button + button, #ctl #stagename { border-left:1px solid var(--fg); }
  #stagename { display:flex; align-items:center; gap:14px; padding:0 30px; min-width:300px; justify-content:center; font-size:13px; letter-spacing:.2em; text-transform:uppercase; }
  #dots { display:flex; gap:6px; } #dots i { width:7px; height:7px; border:1px solid var(--fg); } #dots i.on { background:var(--fg); }
  #modes { right:36px; bottom:28px; display:flex; } #modes button { padding:10px 14px; } #modes button + button { border-left:none; }
  #reset { left:36px; bottom:28px; padding:10px 14px; }
  body { height:100dvh; }

  /* tablets / narrow windows */
  @media (max-width:1100px) {
    #title { left:20px; top:18px; } #mini { right:16px; top:16px; }
    #sites { right:16px; top:90px; width:min(340px, 42vw); }
    #board { left:20px; width:min(460px, 52vw); } #stats { right:16px; }
    #stagename { min-width:180px; padding:0 16px; }
    #ctl button { padding:16px 18px; }
    #modes { right:16px; } #reset { left:16px; }
  }

  /* phones */
  @media (max-width:720px), (max-height:500px) {
    body { overflow:auto; }
    #title { left:max(12px, env(safe-area-inset-left)); top:max(12px, env(safe-area-inset-top)); gap:4px; max-width:55vw; }
    #title b { font-size:18px; letter-spacing:.2em; }
    #mini { right:12px; top:max(10px, env(safe-area-inset-top)); padding:6px; gap:8px; }
    #mini canvas { width:48px !important; height:48px !important; }
    #join, #join.globe { flex-direction:column; justify-content:center; gap:20px; padding:72px 16px 150px; overflow-y:auto; background:rgba(0,0,0,.75); }
    #qrwrap { padding:12px; }
    #qr, #join.globe #qr { width:min(60vw, 34vh, 260px) !important; }
    #joininfo { max-width:100%; align-items:center; text-align:center; gap:10px; }
    #names { justify-content:center; }
    #count { font-size:clamp(48px, 16vw, 96px); }
    #url { word-break:break-all; font-size:11px; }
    #board, #sites, #stats { left:12px; right:12px; width:auto; max-height:34dvh; overflow-y:auto; }
    #board { bottom:128px; } #board .row { font-size:13px; padding:7px 0; }
    #sites { top:84px; padding:10px 12px; } #sites .row { font-size:12px; padding:6px 0; }
    #stats { bottom:auto; top:84px; }
    #ctl { left:12px; right:12px; bottom:max(64px, calc(env(safe-area-inset-bottom) + 56px)); transform:none; }
    #ctl button { padding:14px 12px; font-size:11px; letter-spacing:.12em; flex:none; }
    #stagename { flex:1; min-width:0; padding:0 8px; gap:8px; font-size:11px; letter-spacing:.12em; }
    #sname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #reset { left:12px; bottom:max(12px, env(safe-area-inset-bottom)); padding:10px 12px; }
    #modes { right:12px; bottom:max(12px, env(safe-area-inset-bottom)); } #modes button { padding:10px 10px; }
  }
  @media (max-height:500px) and (orientation:landscape) {
    #join, #join.globe { flex-direction:row; padding:56px 16px 110px; }
    #qr, #join.globe #qr { width:min(40vh, 200px) !important; }
    #ctl { left:50%; right:auto; transform:translateX(-50%); bottom:12px; width:min(460px, 60vw); }
    #board, #sites, #stats { max-height:40dvh; }
    #board { bottom:64px; width:46vw; right:auto; } #sites { left:auto; width:46vw; top:64px; }
  }
</style></head>
<body>
  <canvas class="view" id="view"></canvas>
  <canvas id="field"></canvas>

  <div class="layer" id="title"><b id="brand">CHIP DESIGNER</b><span class="label" id="headline"></span></div>

  <div class="layer" id="join">
    <div id="qrwrap"><canvas id="qr"></canvas></div>
    <div id="joininfo">
      <span class="label">Scan to join · room <span id="code">----</span></span>
      <div id="count">0</div>
      <span class="label" id="countlbl">Players connected</span>
      <div id="names"></div>
      <div id="url"></div>
    </div>
  </div>

  <div class="layer hidden" id="mini"><canvas id="qr2"></canvas><div><span class="label">Join</span><b id="code2">----</b><span class="label" id="count2"></span></div></div>
  <div class="layer hidden" id="board"><div class="label" style="margin-bottom:8px" id="boardlbl">Leaderboard</div><div id="rows"></div></div>
  <div class="layer hidden" id="stats"></div>
  <div class="layer hidden" id="sites"><div class="label" style="margin-bottom:8px" id="siteslbl">Site vote</div><div id="siterows"></div></div>

  <button class="layer" id="reset">Reset</button>
  <div class="layer" id="ctl"><button id="prev">← Prev</button><div id="stagename"><span id="sname">Join</span><span id="dots"></span></div><button class="primary" id="next">Next →</button></div>
  <div class="layer" id="modes"><button data-mode="chip">Chip</button><button data-mode="rack">Rack</button><button onclick="open('/xr.html'+location.search)">XR</button></div>
  <script type="module" src="/src/host.js"></script>
</body></html>
